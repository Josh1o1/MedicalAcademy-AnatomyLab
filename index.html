<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >
    <title>Medical Academy — Anatomy Lab</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <header class="topbar">
        <div>
            <div class="eyebrow">MEDICAL ACADEMY</div>
            <h1>🧬 Anatomy Lab</h1>
        </div>

        <button id="closeBtn" class="icon-btn">×</button>
    </header>

    <main>

        <section class="viewer-card">
            <div id="viewer"></div>

            <div class="viewer-hint">
                <span>↻ Drag</span>
                <span>🔍 Pinch / Scroll</span>
                <span>🎯 Tap structure</span>
            </div>

            <div id="loading" class="loading">
                <div class="loader"></div>
                Preparing anatomy lab…
            </div>
        </section>

        <section class="info-card">

            <div class="section-label">SELECTED STRUCTURE</div>

            <h2 id="structureName">Human Skeleton</h2>

            <p id="structureInfo">
                Explore the major bones of the human skeleton.
                Rotate the model and select a structure to begin.
            </p>

            <div id="structureMeta" class="meta-row">
                <span>🦴 Skeletal System</span>
                <span>🔬 Explore Mode</span>
            </div>

        </section>

        <section class="actions">

            <button id="identifyBtn" class="primary-btn">
                🎯 Identify a Bone
            </button>

            <button id="resetBtn" class="secondary-btn">
                ↻ Reset View
            </button>

        </section>

    </main>

    <footer>
        <span>Medical Academy</span>
        <span>3D Anatomy Lab · v0.1</span>
    </footer>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
